<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Avatar</title>
<style>
  html,body{margin:0;height:100%;background:#07020f;overflow:hidden;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // ?style=art -> ART arayüzü, aksi hâlde NEON. Her ikisi de aynı window.avatar API'sini sunar.
  (function () {
    var style = new URLSearchParams(location.search).get('style');
    var s = document.createElement('script');
    s.src = style === 'art' ? 'art.js' : 'avatar.js';
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
