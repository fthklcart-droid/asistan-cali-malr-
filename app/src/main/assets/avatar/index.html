<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Avatar</title>
<style>
  html,body{margin:0;height:100%;background:#07020f;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;transform-origin:50% 45%;will-change:transform;background:#07020f}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #h{pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><canvas id="h"></canvas></div>
<script>
  // ?style=art -> ART arayüzü, aksi hâlde NEON. Her ikisi de aynı window.avatar API'sini sunar.
  (function () {
    var style = new URLSearchParams(location.search).get('style');
    var s = document.createElement('script');
    s.src = style === 'art' ? 'art.js' : 'avatar.js';
    // 3B holografik katman avatar betiğinden sonra yüklenir ve onun API'sine bağlanır.
    s.onload = function () { var h = document.createElement('script'); h.src = 'holo3d.js'; document.body.appendChild(h); };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
