name: Android build

on:
  push:
    branches-ignore: [apk-builds, smoke-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # yalnızca APK'yı Releases sayfasına ve apk-builds dalına koymak için

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve APK (Android 16 / SDK 36)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Çalıştırıcıda Android SDK hazır; yalnız SDK 36 platformu ve derleme araçları eklenir.
      - name: Android SDK 36
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim ve entegrasyon testleri
        run: ./gradlew --no-daemon testTamReleaseUnitTest

      - name: Android lint (hata ve uyarılar)
        continue-on-error: true
        run: ./gradlew --no-daemon lintTamDebug

      # Release APK'lar: hata ayıklanamaz (debuggable=false), v1+v2+v3 imzalı.
      # Depo sırlarında SRIUS_KEYSTORE_BASE64 vb. tanımlıysa üretim anahtarıyla, değilse depodaki test anahtarıyla imzalanır.
      - name: Release APK (tam + basit)
        env:
          KS_B64: ${{ secrets.SRIUS_KEYSTORE_BASE64 }}
          SRIUS_STORE_PASSWORD: ${{ secrets.SRIUS_STORE_PASSWORD }}
          SRIUS_KEY_ALIAS: ${{ secrets.SRIUS_KEY_ALIAS }}
          SRIUS_KEY_PASSWORD: ${{ secrets.SRIUS_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SRIUS_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleTamRelease assembleBasitRelease bundleTamRelease bundleBasitRelease
          if [ -z "$KS_B64" ]; then
            echo "::warning::Üretim imza anahtarı tanımlı değil: APK/AAB depodaki TEST anahtarıyla imzalandı. Google Play'e yüklemek ve geliştirici doğrulaması için kendi anahtarını SRIUS_KEYSTORE_BASE64 vb. sırlarla ver."
          fi

      - name: APK doğrula (imza şemaları, debuggable, SDK, izinler)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          for F in tam basit; do
            APK="app/build/outputs/apk/$F/release/app-$F-release.apk"
            echo "== $F =="
            "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer #1 certificate DN|Number of signers"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|application-debuggable" || true
            "$BT/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
            if "$BT/aapt" dump badging "$APK" | grep -q "application-debuggable"; then echo "HATA: debuggable"; exit 1; fi
            "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -c "BIND_ACCESSIBILITY_SERVICE" || true
            cp "$APK" "out/SRIUS_JARVIS_$F.apk"
          done
          # Google Play App Bundle'ları (Play Console'a yüklenecek dosyalar)
          cp app/build/outputs/bundle/tamRelease/app-tam-release.aab out/SRIUS_JARVIS_tam.aab
          cp app/build/outputs/bundle/basitRelease/app-basit-release.aab out/SRIUS_JARVIS_basit.aab
          # Geliştirici doğrulaması / Play Console için imza sertifikası SHA-256 parmak izi
          echo "== İmza sertifikası =="
          "$BT/apksigner" verify --print-certs out/SRIUS_JARVIS_tam.apk | grep -E "SHA-256|DN"
          if "$BT/aapt" dump xmltree out/SRIUS_JARVIS_basit.apk AndroidManifest.xml | grep -q "BIND_ACCESSIBILITY_SERVICE"; then
            echo "HATA: basit sürümde erişilebilirlik hizmeti olmamalı"; exit 1
          fi
          ls -la out

      - name: Test raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: SRIUS-JARVIS-APK
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

      # Telefondan doğrudan indirilebilsin diye: Releases sayfasında "apk-latest" ön sürümü + apk-builds dalı.
      - name: APK'yı yayınla (Releases + apk-builds dalı)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest out/SRIUS_JARVIS_tam.apk out/SRIUS_JARVIS_basit.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "SRİUS JARVIS — son APK ($SHORT)" \
            --notes "Dal: ${GITHUB_REF_NAME}, commit $SHORT. Release (hata ayıklanamaz), v1+v2+v3 imzalı. tam: ekran kontrolü (erişilebilirlik) dahil. basit: erişilebilirlik hizmeti yok — Play Protect tam sürümü engellerse bunu kur. Gerçek cihazda test edilmedi."
          cp out/SRIUS_JARVIS_tam.apk out/SRIUS_JARVIS_basit.apk "$RUNNER_TEMP/"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf -q --cached . && git clean -fdq
          cp "$RUNNER_TEMP/SRIUS_JARVIS_tam.apk" "$RUNNER_TEMP/SRIUS_JARVIS_basit.apk" .
          git add SRIUS_JARVIS_tam.apk SRIUS_JARVIS_basit.apk
          git commit -q -m "SRİUS JARVIS APK ($SHORT)"
          git push -f origin apk-builds

  # Emülatörde gerçek çalıştırma: kur, aç, tüm bölmeleri gez, ekran görüntüsü al, çökmeleri yakala.
  smoke:
    name: Emülatör testi (Android 15)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK 36
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK (test için)
        run: ./gradlew --no-daemon assembleTamDebug
      - name: Emülatörde çalıştır
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke_test.sh app/build/outputs/apk/tam/debug/app-tam-debug.apk smoke
      - name: Sonuçlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-testi
          path: smoke/
      - name: Sonuçları smoke-results dalına koy
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d smoke ] || exit 0
          cp -r smoke "$RUNNER_TEMP/smoke"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan smoke-results
          git rm -rf -q --cached . && git clean -fdq
          cp -r "$RUNNER_TEMP/smoke/." .
          rm -f ui.xml
          git add -A
          git commit -q -m "Emülatör testi ${GITHUB_SHA::7}"
          git push -f origin smoke-results
