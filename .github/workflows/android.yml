name: Android build

on:
  push:
    branches-ignore: [apk-builds]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # yalnızca APK'yı Releases sayfasına ve apk-builds dalına koymak için

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test ve APK (Android 16 / SDK 36)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Çalıştırıcıda Android SDK hazır; yalnız SDK 36 platformu ve derleme araçları eklenir.
      - name: Android SDK 36
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim ve entegrasyon testleri
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK (test anahtarıyla imzalı)
        run: ./gradlew --no-daemon assembleDebug

      # Depo sırlarında SRIUS_KEYSTORE_BASE64 vb. tanımlıysa üretim imzalı release APK, değilse imzasız release APK.
      - name: Release APK
        env:
          KS_B64: ${{ secrets.SRIUS_KEYSTORE_BASE64 }}
          SRIUS_STORE_PASSWORD: ${{ secrets.SRIUS_STORE_PASSWORD }}
          SRIUS_KEY_ALIAS: ${{ secrets.SRIUS_KEY_ALIAS }}
          SRIUS_KEY_PASSWORD: ${{ secrets.SRIUS_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SRIUS_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: APK doğrula (imza, SDK sürümleri)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:"
          "$BT/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          "$BT/aapt" dump permissions "$APK"
          mkdir -p out
          cp "$APK" out/SRIUS_JARVIS_debug.apk
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out

      - name: Test raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: SRIUS-JARVIS-APK
          path: out/*.apk
          if-no-files-found: error

      # Telefondan doğrudan indirilebilsin diye: Releases sayfasında "apk-latest" ön sürümü + apk-builds dalı.
      - name: APK'yı yayınla (Releases + apk-builds dalı)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest out/SRIUS_JARVIS_debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "SRİUS JARVIS — son debug APK ($SHORT)" \
            --notes "Dal: ${GITHUB_REF_NAME}, commit $SHORT. Test anahtarıyla imzalı debug APK. Gerçek cihazda test edilmedi."
          cp out/SRIUS_JARVIS_debug.apk "$RUNNER_TEMP/app.apk"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf -q --cached . && git clean -fdq
          cp "$RUNNER_TEMP/app.apk" SRIUS_JARVIS_debug.apk
          git add SRIUS_JARVIS_debug.apk
          git commit -q -m "SRİUS JARVIS debug APK ($SHORT)"
          git push -f origin apk-builds
